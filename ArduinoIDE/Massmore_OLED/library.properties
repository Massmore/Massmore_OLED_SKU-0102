sentence=One driver for all 12 Massmore I2C OLED modules (SKU-0102): SSD1306, SH1106, SH1107 and SSD1309.
paragraph=Data-driven profile table selected by SKU, by controller or AUTO. Adafruit-GFX-compatible drawing API and GFXfont support, built-in Thai text rendering (UTF-8 + tone/vowel placement) with Sarabun fonts 12-32 px (SIL OFL 1.1), UI widgets, hardware and software scroll, non-blocking page refresh and controller identity verification. No external dependencies, no dynamic allocation, no hardcoded pins. Supported: ESP32, ESP32-S3 (Arduino-ESP32 Core 3.x+) and AVR ATmega328P (Arduino Nano).
category=Display
